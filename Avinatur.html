<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVINATUR - Punti Agosto</title>
<style>
:root{
 --bg:#ffffff;--card:#ffffff;--text:#111111;--muted:#5f5f5f;--line:#d9d9d9;
 --dark:#000000;--accent:#F9B233;--accent-soft:#fff3d6
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text)}
.app{max-width:1500px;margin:auto;padding:26px}
.header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:18px}
h1{margin:0;font-size:28px;letter-spacing:-.02em}
.subtitle{margin:7px 0 0;color:var(--muted);font-size:14px}
.langs{display:flex;gap:7px;flex-wrap:wrap}
.lang,.reset{
 border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 13px;
 cursor:pointer;font-weight:700;color:var(--text)
}
.lang.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.controls{
 background:var(--card);border:1px solid var(--line);border-radius:13px;
 box-shadow:0 2px 10px rgba(0,0,0,.06);padding:15px;margin-bottom:14px
}
.filter-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:12px;align-items:end}
.field label{display:block;margin:0 0 6px;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.field input,.field select{
 width:100%;border:1px solid var(--line);background:#fff;color:var(--text);
 padding:10px 11px;border-radius:8px;font-size:14px
}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.kpi{background:#fafafa;border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:13px;color:var(--muted)}
.kpi strong{color:var(--text);font-size:15px;margin-right:5px}
.table-card{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}
.table-wrap{overflow:auto;max-height:72vh}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:1050px}
thead th{
 position:sticky;top:0;z-index:3;background:var(--dark);color:#fff;
 padding:12px 11px;text-align:left;font-size:11px;text-transform:uppercase;
 letter-spacing:.045em;border-right:1px solid #3b4652
}
tbody td{padding:11px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px;line-height:1.45}
tbody tr:hover{background:#fff8e8}
.col-dept{width:18%;font-weight:750}
.col-type{width:12%}
.col-desc{width:44%}
.col-note{width:26%;color:#46515c;white-space:pre-line}
.type-badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#f3f3f3}
.type-Elettrico{background:#fff3d6;color:#111111;border:1px solid #F9B233}
.type-Meccanico{background:#f3f3f3;color:#111111;border:1px solid #d0d0d0}
.type-Collaudo{background:#F9B233;color:#111111;border:1px solid #F9B233}
.empty{padding:38px;text-align:center;color:var(--muted)}
.footer{padding:11px 14px;color:var(--muted);font-size:11px;border-top:1px solid var(--line);background:#fafafa}
@media(max-width:900px){
 .app{padding:14px}.header{flex-direction:column}.filter-grid{grid-template-columns:1fr}.table-wrap{max-height:none}
}

.brandbar{
 background:#000000;
 border-bottom:5px solid #F9B233;
 padding:18px 0;
}
.brandbar-inner{
 max-width:1500px;
 margin:0 auto;
 padding:0 26px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:20px;
}
.brand-logo{
 display:block;
 width:min(320px,55vw);
 max-height:82px;
 object-fit:contain;
 object-position:left center;
}
.brand-tag{
 color:#ffffff;
 font-size:12px;
 font-weight:800;
 letter-spacing:.12em;
 text-transform:uppercase;
 white-space:nowrap;
}
.header{
 border-bottom:1px solid var(--line);
 padding-bottom:18px;
}
h1::after{
 content:"";
 display:block;
 width:72px;
 height:4px;
 background:#F9B233;
 margin-top:10px;
}
.lang.active{
 background:#F9B233;
 color:#111111;
 border-color:#F9B233;
}
.reset:hover{
 background:#F9B233;
 border-color:#F9B233;
}
thead th{
 background:#000000 !important;
 border-right:1px solid #2a2a2a !important;
}
.field input:focus,.field select:focus{
 border-color:#F9B233;
 box-shadow:0 0 0 3px rgba(249,178,51,.18);
 outline:none;
}
@media(max-width:900px){
 .brandbar-inner{padding:0 14px}
 .brand-tag{display:none}
}


.actions{display:flex;gap:8px;align-items:center}
.print-btn{
 border:1px solid #F9B233;
 border-radius:8px;
 background:#F9B233;
 color:#111111;
 padding:10px 14px;
 font-weight:800;
 cursor:pointer;
 white-space:nowrap
}
.print-btn:hover{background:#000;color:#fff;border-color:#000}
.print-only{display:none}
.done-cell{white-space:nowrap;text-align:center;font-weight:700}

@media print{
 @page{size:A4 landscape;margin:10mm}
 body{background:#fff!important}
 .brandbar{padding:8px 0!important;border-bottom:3px solid #F9B233!important}
 .brandbar-inner{padding:0 10mm!important}
 .brand-logo{width:190px!important;max-height:52px!important}
 .brand-tag{display:block!important;font-size:9px!important}
 .app{max-width:none!important;padding:8mm 10mm!important}
 .header{margin-bottom:8px!important;padding-bottom:8px!important}
 .header .langs,.controls,.footer{display:none!important}
 .subtitle{font-size:10px!important}
 h1{font-size:18px!important}
 h1::after{height:3px!important;margin-top:6px!important}
 .table-card{border:none!important;overflow:visible!important}
 .table-wrap{overflow:visible!important;max-height:none!important}
 table{min-width:0!important;width:100%!important;font-size:9px!important}
 thead{display:table-header-group}
 tr{page-break-inside:avoid}
 thead th{
   position:static!important;
   background:#000!important;
   color:#fff!important;
   -webkit-print-color-adjust:exact;
   print-color-adjust:exact;
   font-size:8px!important;
   padding:6px 5px!important
 }
 tbody td{
   font-size:8.5px!important;
   line-height:1.25!important;
   padding:6px 5px!important;
   border-bottom:1px solid #bfbfbf!important
 }
 tbody tr:nth-child(even){
   background:#fafafa!important;
   -webkit-print-color-adjust:exact;
   print-color-adjust:exact
 }
 .col-dept{width:14%!important}
 .col-type{width:10%!important}
 .col-desc{width:38%!important}
 .col-note{width:28%!important}
 .print-only{display:table-cell!important}
 th.print-only{width:10%!important;text-align:center!important}
 .done-cell{width:10%!important;font-size:9px!important}
 .type-badge{
   background:transparent!important;
   color:#111!important;
   border:1px solid #999!important;
   padding:2px 4px!important
 }
}


.col-hours{width:6%;text-align:center}
.col-tech{width:12%;text-align:center}
.hours-input,.tech-select{
 width:100%;
 min-width:58px;
 border:1px solid var(--line);
 border-radius:7px;
 padding:6px 7px;
 background:#fff;
 color:#111;
 font:inherit;
 text-align:center
}
.hours-input:focus,.tech-select:focus{
 outline:none;
 border-color:#F9B233;
 box-shadow:0 0 0 3px rgba(249,178,51,.18)
}
.print-value{display:none}
@media print{
 .hours-input,.tech-select{display:none!important}
 .print-value{display:inline!important;font-weight:700}
 .col-hours{width:6%!important;text-align:center!important}
 .col-tech{width:12%!important;text-align:center!important}
 .col-dept{width:12%!important}
 .col-type{width:9%!important}
 .col-desc{width:27%!important}
 .col-note{width:25%!important}
 th#hHours,th#hTech{text-align:center!important}
}


.tech-legend{
 margin-top:10px;
 font-size:11px;
 font-weight:700;
 color:var(--muted)
}
.excel-hours{
 display:inline-block;
 min-width:32px;
 font-weight:800;
 text-align:center
}
.tech-code{
 display:inline-block;
 width:100%;
 white-space:normal;
 line-height:1.2;
 font-size:11px;
 align-items:center;
 justify-content:center;
 min-width:34px;
 min-height:28px;
 padding:3px 7px;
 border:1px solid #F9B233;
 border-radius:7px;
 background:#fff7e7;
 color:#111;
 font-weight:900;
 letter-spacing:.04em
}
@media print{
 .tech-legend{display:none!important}
 .excel-hours,.tech-code{
  border:none!important;
  background:transparent!important;
  padding:0!important;
  min-height:0!important
 }
}

</style>
</head>

"technician":""},{"department":"MEYN","type":"Meccanico","description":"2022-003290 | CT-1500-E | Head Conveyor Turkey — Mechanically installed","note":"MEYN Area: Evisceration\nAvinatur: \n- machine need to be thoroughly cleaned; there is a lot of sand on the unit.\n- Many nozzles were clogged and will need to be flushed if there is sufficient water pressure in the piping system.","description_i18n":{"it":"2022-003290 | CT-1500-E | TRASPORTATORE TESTE TACCHINI — Installazione meccanica","en":"2022-003290 | CT-1500-E | TURKEY HEAD CONVEYOR — Mechanical installation","es":"2022-003290 | CT-1500-E | TRANSPORTADOR DE CABEZAS DE PAVO — Instalación mecánica"},"note_i18n":{"it":"Area MEYN: Eviscerazione\nAvinatur:\n- La macchina deve essere pulita accuratamente; è presente molta sabbia sull'unità.\n- Molti ugelli risultano ostruiti e dovranno essere risciacquati, purché nell'impianto di tubazioni sia disponibile una pressione dell'acqua sufficiente.","en":"MEYN Area: Evisceration\nAvinatur:\n- The machine must be thoroughly cleaned; there is a large amount of sand on the unit.\n- Many nozzles are clogged and must be flushed, provided that sufficient water pressure is available in the piping system.","es":"Área MEYN: Evisceración\nAvinatur:\n- La máquina debe limpiarse a fondo; hay una gran cantidad de arena en la unidad.\n- Muchas boquillas están obstruidas y deberán enjuagarse, siempre que haya suficiente presión de agua en el sistema de tuberías."},"hours":"","technician":""},{"department":"MEYN","type":"Meccanico","description":"2022-003290 | CT-1500-E | Head Conveyor Turkey — Electrically connected","note":"MEYN Area: Evisceration\nMeyn: synchronisation isn't working. $0 teeth gearwheel necessary for the inline trigger. Ordered 10-08-2026","description_i18n":{"it":"2022-003290 | CT-1500-E | TRASPORTATORE TESTE TACCHINI — Collegamento elettrico","en":"2022-003290 | CT-1500-E | TURKEY HEAD CONVEYOR — Electrical connection","es":"2022-003290 | CT-1500-E | TRANSPORTADOR DE CABEZAS DE PAVO — Conexión eléctrica"},"note_i18n":{"it":"Area MEYN: Eviscerazione\nMEYN: la sincronizzazione non funziona. È necessario un ingranaggio da $0 denti per il trigger in linea. Ordinato il 10-08-2026.","en":"MEYN Area: Evisceration\nMEYN: synchronization is not working. A $0-tooth gearwheel is required for the inline trigger. Ordered on 10-08-2026.","es":"Área MEYN: Evisceración\nMEYN: la sincronización no funciona. Se necesita un engranaje de $0 dientes para el trigger en línea. Pedido el 10-08-2026."},"hours":"","technician":""},{"department":"MEYN","type":"Meccanico","description":"2022-003189 | CT-1815-E-10L | I/O Washer 10u R Turkey — Mechanically installed","note":"MEYN Area: Evisceration\nAvinatur: \n- machine need to be thoroughly cleaned and lubricated\n- emergency bar is missing. During viist in July 2026 Food Project promised to manufacture.","description_i18n":{"it":"2022-003189 | CT-1815-E-10L | LAVATRICE INTERNO/ESTERNO 10U R PER TACCHINI — Installazione meccanica","en":"2022-003189 | CT-1815-E-10L | TURKEY INSIDE/OUTSIDE WASHER 10U R — Mechanical installation","es":"2022-003189 | CT-1815-E-10L | LAVADORA INTERIOR/EXTERIOR 10U R PARA PAVOS — Instalación mecánica"},"note_i18n":{"it":"Area MEYN: Eviscerazione\nAvinatur:\n- La macchina deve essere pulita e lubrificata accuratamente.\n- Manca la barra di emergenza. Durante la visita di luglio 2026 Food Project si è impegnata a realizzarla.","en":"MEYN Area: Evisceration\nAvinatur:\n- The machine must be thoroughly cleaned and lubricated.\n- The emergency bar is missing. During the July 2026 visit, Food Project committed to manufacturing it.","es":"Área MEYN: Evisceración\nAvinatur:\n- La máquina debe limpiarse y lubricarse a fondo.\n- Falta la barra de emergencia. Durante la visita de julio de 2026, Food Project se comprometió a fabricarla."},"hours":"","technician":""},{"department":"MEYN","type":"Meccanico","description":"2022-003189 | CT-1815-E-10L | I/O Washer 10u R Turkey — Pressure pump","note":"MEYN Area: Evisceration\nThe pump was not running but after checking the PLC software I found the\nissue, we test the machine but after customer provide internet connection the\ndisplay software need to be checked by Meyn PLC department","description_i18n":{"it":"2022-003189 | CT-1815-E-10L | LAVATRICE INTERNO/ESTERNO 10U R PER TACCHINI — Pompa di pressione","en":"2022-003189 | CT-1815-E-10L | TURKEY INSIDE/OUTSIDE WASHER 10U R — Pressure pump","es":"2022-003189 | CT-1815-E-10L | LAVADORA INTERIOR/EXTERIOR 10U R PARA PAVOS — Bomba de presión"},"note_i18n":{"it":"Area MEYN: Eviscerazione\nLa pompa non funzionava; dopo aver verificato il software PLC è stato individuato il problema e la macchina è stata testata. Quando il cliente avrà fornito la connessione Internet, il software del display dovrà essere verificato dal reparto PLC di MEYN.","en":"MEYN Area: Evisceration\nThe pump was not running. After checking the PLC software, the issue was identified and the machine was tested. Once the customer provides an Internet connection, the display software must be checked by the MEYN PLC department.","es":"Área MEYN: Evisceración\nLa bomba no funcionaba. Tras revisar el software del PLC se identificó el problema y se probó la máquina. Cuando el cliente proporcione una conexión a Internet, el software de la pantalla deberá ser revisado por el departamento de PLC de MEYN."},"hours":"","technician":""},{"department":"MEYN","type":"Meccanico","description":"2025-010428 | 0141-V013348 | Rehanger hock cutter Turkey — Mechanically installed","note":"MEYN Area: Evisceration\nMeyn:\n- Install extra divisible rings on the 3 main shafts to prevent them from sagging. 1x 60 mm and 2x 45 mm.\n- Place a plastic plate near the transfer point of the EV line to push back the green plastic sliding plate of the trolley.\n- Replace the existing circular blade of the hoc cutter with a serrated version","description_i18n":{"it":"2025-010428 | 0141-V013348 | RIAPPENDITORE CON TAGLIA-GARRETTI PER TACCHINI — Installazione meccanica","en":"2025-010428 | 0141-V013348 | TURKEY REHANGER WITH HOCK CUTTER — Mechanical installation","es":"2025-010428 | 0141-V013348 | REENGANCHADOR CON CORTADOR DE CORVEJONES PARA PAVOS — Instalación mecánica"},"note_i18n":{"it":"Area MEYN: Eviscerazione\nMEYN:\n- Installare anelli divisibili aggiuntivi sui 3 alberi principali per evitarne la flessione: 1 × 60 mm e 2 × 45 mm.\n- Installare una piastra in plastica vicino al punto di trasferimento della linea EV per riportare indietro la piastra scorrevole verde in plastica del trolley.\n- Sostituire la lama circolare esistente del taglia-garretti con una versione dentata.","en":"MEYN Area: Evisceration\nMEYN:\n- Install additional split rings on the 3 main shafts to prevent sagging: 1 × 60 mm and 2 × 45 mm.\n- Install a plastic plate near the EV-line transfer point to push back the trolley's green plastic sliding plate.\n- Replace the existing circular hock-cutter blade with a serrated version.","es":"Área MEYN: Evisceración\nMEYN:\n- Instalar anillos partidos adicionales en los 3 ejes principales para evitar su flexión: 1 × 60 mm y 2 × 45 mm.\n- Instalar una placa de plástico cerca del punto de transferencia de la línea EV para empujar hacia atrás la placa deslizante verde de plástico del carro.\n- Sustituir la cuchilla circular existente del cortador de corvejones por una versión dentada."},"hours":"","technician":""},{"department":"MEYN","type":"Meccanico","description":"2025-010428 | 0141-V013348 | Rehanger hock cutter Turkey — Software","note":"MEYN Area: Evisceration\nMeyn: water valve for the disk motor need to be open every time the infeed line is running, after customer provide internet connection the rehanger software need to be checked by Meyn PLC department","description_i18n":{"it":"2025-010428 | 0141-V013348 | RIAPPENDITORE CON TAGLIA-GARRETTI PER TACCHINI — Software","en":"2025-010428 | 0141-V013348 | TURKEY REHANGER WITH HOCK CUTTER — Software","es":"2025-010428 | 0141-V013348 | REENGANCHADOR CON CORTADOR DE CORVEJONES PARA PAVOS — Software"},"note_i18n":{"it":"Area MEYN: Eviscerazione\nMEYN: la valvola dell'acqua del motore del disco deve essere aperta ogni volta che la linea di alimentazione è in marcia. Quando il cliente avrà fornito la connessione Internet, il software del riappenditore dovrà essere verificato dal reparto PLC di MEYN.","en":"MEYN Area: Evisceration\nMEYN: the disk-motor water valve must be open whenever the infeed line is running. Once the customer provides an Internet connection, the rehanger software must be checked by the MEYN PLC department.","es":"Área MEYN: Evisceración\nMEYN: la válvula de agua del motor del disco debe estar abierta siempre que la línea de entrada esté en marcha. Cuando el cliente proporcione una conexión a Internet, el software del reenganchador deberá ser revisado por el departamento de PLC de MEYN."},"hours":"","technician":""},{"department":"MEYN","type":"Meccanico","description":"823584 | CT-1566-E | Control Panel Evisceration — eWon modem connection","note":"MEYN Area: Evisceration\nAvinatur: Internet connection need to be inplace and tested","description_i18n":{"it":"823584 | CT-1566-E | QUADRO DI CONTROLLO EVISCERAZIONE — Connessione modem eWON","en":"823584 | CT-1566-E | EVISCERATION CONTROL PANEL — eWON modem connection","es":"823584 | CT-1566-E | CUADRO DE CONTROL DE EVISCERACIÓN — Conexión del módem eWON"},"note_i18n":{"it":"Area MEYN: Eviscerazione\nAvinatur: predisporre e testare la connessione Internet.","en":"MEYN Area: Evisceration\nAvinatur: provide and test the Internet connection.","es":"Área MEYN: Evisceración\nAvinatur: proporcionar y probar la conexión a Internet."},"hours":"","technician":""}];

 ["sicurezza","seguridad"],["ringhiera","barandilla"],["cablaggi","cableados"],["cavi","cables"],["cavo","cable"],
 ["corretto funzionamento","funcionamiento correcto"],["funzionamento","funcionamiento"],["alimentazione","alimentación"],
 ["approvvigionamento","suministro"],["scarico","desagüe"],["reflue","residuales"],["regolazione altezza","regulación de altura"],
 ["operatore","operador"],["Teste","cabezas"],["Gozzi","buches"],["Intestini","intestinos"],["Polmoni","pulmones"],["Ventrigli","mollejas"],
 ["Zampe","patas"],["zampe","patas"],["reparto","área"]
 ]
};

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function trDept(s,l){return l==="it"?s:(deptTranslations[s]?.[l]||s)}
function trType(s,l){return l==="it"?s:(typeTranslations[s]?.[l]||s)}
function localDesc(r,l){
 if(r.description_i18n)return r.description_i18n[l]||r.description;
 return trText(r.description,l);
}
function localNote(r,l){
 if(r.note_i18n)return r.note_i18n[l]||r.note;
 return trText(r.note,l);
}
function trText(s,l){
 if(l==="it"||!s)return s;
 let v=s;
 for(const [a,b] of repl[l])v=v.split(a).join(b);
 return v;
}

let lang="it";
const $=id=>document.getElementById(id);
const e={title:$("title"),subtitle:$("subtitle"),searchLabel:$("searchLabel"),search:$("search"),typeLabel:$("typeLabel"),
typeFilter:$("typeFilter"),deptLabel:$("deptLabel"),deptFilter:$("deptFilter"),resetBtn:$("resetBtn"),
visibleCount:$("visibleCount"),visibleText:$("visibleText"),deptCount:$("deptCount"),deptText:$("deptText"),
typeCount:$("typeCount"),typeText:$("typeText"),hDept:$("hDept"),hType:$("hType"),hDesc:$("hDesc"),hNote:$("hNote"),techLegend:$("techLegend"),
tbody:$("tbody"),empty:$("empty"),footer:$("footer"),printBtn:$("printBtn"),hDone:$("hDone"),hHours:$("hHours"),hTech:$("hTech")};

function applyUI(){
 const t=UI[lang];document.documentElement.lang=lang;
 e.title.textContent=t.title;e.subtitle.textContent=t.subtitle;e.searchLabel.textContent=t.search;e.search.placeholder=t.searchPH;
 e.typeLabel.textContent=t.type;e.deptLabel.textContent=t.department;e.resetBtn.textContent=t.reset;
 e.visibleText.textContent=t.visible;e.deptText.textContent=t.departments;e.typeText.textContent=t.types;
 e.hDept.textContent=t.hDept;e.hType.textContent=t.hType;e.hDesc.textContent=t.hDesc;e.hNote.textContent=t.hNote;e.techLegend.textContent=t.techLegend;
 e.empty.textContent=t.empty;e.footer.textContent=t.footer;e.printBtn.textContent=t.print;e.hDone.textContent=t.done;e.hHours.textContent=t.hours;e.hTech.textContent=t.technician;
 document.querySelectorAll(".lang").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
}
function buildFilters(){
 const oldT=e.typeFilter.value,oldD=e.deptFilter.value;
 const types=[...new Set(rows.map(r=>r.type).filter(Boolean))].sort();
 const deps=[...new Set(rows.map(r=>r.department).filter(Boolean))].sort();
 e.typeFilter.innerHTML=`<option value="">${esc(UI[lang].allTypes)}</option>`+types.map(x=>`<option value="${esc(x)}">${esc(trType(x,lang))}</option>`).join("");
 e.deptFilter.innerHTML=`<option value="">${esc(UI[lang].allDepartments)}</option>`+deps.map(x=>`<option value="${esc(x)}">${esc(trDept(x,lang))}</option>`).join("");
 if(types.includes(oldT))e.typeFilter.value=oldT;if(deps.includes(oldD))e.deptFilter.value=oldD;
}


function technicianLabel(code,l){
 code=(code||"").toUpperCase().replace(/[^EMS]/g,"");
 if(!code)return "";

 const counts={E:0,M:0,S:0};
 for(const c of code)counts[c]++;

 const role={
  it:{
   E:{one:"Elettrico",many:"Elettrici"},
   M:{one:"Meccanico",many:"Meccanici"},
   S:{one:"Specialista",many:"Specialisti"}
  },
  en:{
   E:{one:"Electrical",many:"Electrical technicians"},
   M:{one:"Mechanical",many:"Mechanical technicians"},
   S:{one:"Specialist",many:"Specialists"}
  },
  es:{
   E:{one:"Eléctrico",many:"Eléctricos"},
   M:{one:"Mecánico",many:"Mecánicos"},
   S:{one:"Especialista",many:"Especialistas"}
  }
 };

 const parts=[];
 for(const c of ["E","M","S"]){
  const n=counts[c];
  if(!n)continue;
  const names=role[l]||role.it;
  parts.push(n===1 ? names[c].one : `${n} ${names[c].many}`);
 }
 return parts.join(" + ");
}

function commissioningCells(r){
 if(r.type!=="Collaudo") return '<td class="col-hours"></td><td class="col-tech"></td>';
 const h=(r.hours===null||r.hours===undefined)?"":r.hours;
 const t=r.technician||"";
 return `<td class="col-hours"><span class="excel-hours">${esc(h)}</span></td>
 <td class="col-tech"><span class="tech-code">${esc(technicianLabel(t,lang))}</span></td>`;
}

function render(){
 const q=e.search.value.trim().toLowerCase(),t=e.typeFilter.value,d=e.deptFilter.value;
 const filtered=rows.filter(r=>{
  if(t&&r.type!==t)return false;if(d&&r.department!==d)return false;if(!q)return true;
  return [r.department,r.type,r.description,r.note,trDept(r.department,lang),trType(r.type,lang),localDesc(r,lang),localNote(r,lang)].join(" ").toLowerCase().includes(q);
 });
 e.tbody.innerHTML=filtered.map(r=>`<tr>
 <td class="col-dept">${esc(trDept(r.department,lang))}</td>
 <td class="col-type"><span class="type-badge type-${esc(r.type.replace(/\s+/g,""))}">${esc(trType(r.type,lang))}</span></td>
 ${commissioningCells(r)}
 <td class="col-desc">${esc(localDesc(r,lang))}</td>
 <td class="col-note">${esc(localNote(r,lang))}</td>
 <td class="print-only done-cell">☐ ${esc(UI[lang].yes)}&nbsp;&nbsp;&nbsp;☐ ${esc(UI[lang].no)}</td>
 </tr>`).join("");
 e.empty.style.display=filtered.length?"none":"block";
 e.visibleCount.textContent=filtered.length;
 e.deptCount.textContent=new Set(filtered.map(r=>r.department).filter(Boolean)).size;
 e.typeCount.textContent=new Set(filtered.map(r=>r.type).filter(Boolean)).size;
}
document.querySelectorAll(".lang").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;applyUI();buildFilters();render()}));
e.search.addEventListener("input",render);e.typeFilter.addEventListener("change",render);e.deptFilter.addEventListener("change",render);
e.resetBtn.addEventListener("click",()=>{e.search.value="";e.typeFilter.value="";e.deptFilter.value="";render()});
e.printBtn.addEventListener("click",()=>window.print());
applyUI();buildFilters();render();
</script>
</body>
</html>
